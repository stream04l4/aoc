services:
  aoc-postgres:
    image: postgres:16-alpine
    container_name: aoc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aoc_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-aoc}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aoc_pg_data:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aoc} -d ${POSTGRES_DB:-aoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  aoc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aoc-core
    restart: unless-stopped
    depends_on:
      aoc-postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      AOC_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-aoc}:${POSTGRES_PASSWORD:-aoc_local_dev}@aoc-postgres:5432/${POSTGRES_DB:-aoc}
      AOC_MEMORY__LETTA_BASE_URL: http://aoc-letta:8283
      AOC_RUNNER__ENABLED: ${AOC_RUNNER__ENABLED:-true}
      AOC_RUNNER__SOCKET_PATH: /run/aoc-runner/runner.sock
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - ./config:/app/config:ro
      - /run/aoc-runner:/run/aoc-runner
      - ${AOC_WORKSPACE_ROOT:-/home/ubuntu/aoc-workspaces}:/home/ubuntu/aoc-workspaces
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:9200/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  aoc-letta:
    image: letta/letta:0.16.4
    container_name: aoc-letta
    restart: unless-stopped
    ports:
      - "127.0.0.1:8283:8283"
    volumes:
      - aoc_letta_pg_data:/var/lib/postgresql/data
    environment:
      OPENAI_API_KEY: ${AOC_LLM__API_KEY:-dummy}
      OPENAI_API_BASE: ${AOC_LLM__BASE_URL:-http://127.0.0.1:8000/v1}
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8283/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  aoc_pg_data:
  aoc_letta_pg_data:
