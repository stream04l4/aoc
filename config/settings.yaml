# AOC runtime settings. Secrets (API keys, DB password) come from environment / .env only.
organism:
  name: "AOC-001"
  version: "1.0.0"

runtime:
  cycle_interval_seconds: 60        # pause between active cycles
  idle_sleep_seconds: 300           # sleep when nothing worth doing (scheduled wake-up)
  critical_interval_seconds: 30     # faster cadence in CRITICAL state
  throttled_max_sleep_seconds: 900  # max sleep slice while waiting for quota_reset_at
  monitor_poll_seconds: 5           # how often WAIT/MONITOR polls running executions
  max_wait_per_cycle_seconds: 120   # loop never blocks longer than this on a task; task keeps running
  max_cycles: 0                     # 0 = unlimited (used by tests to bound runs)
  stale_active_goal_hours: 12     # auto-abandon orphaned ACTIVE goals idle beyond this window

api:
  host: "127.0.0.1"
  port: 9200
  auth_enabled: true
  # admin_key: from AOC_API__ADMIN_KEY
  # internal_token: from AOC_API__INTERNAL_TOKEN (for /metrics & /v1/embeddings)

database:
  # Full URL comes from AOC_DATABASE__URL; this is only the local default.
  url: "postgresql+asyncpg://aoc:aoc@127.0.0.1:5433/aoc"
  echo: false

llm:
  base_url: "http://127.0.0.1:8000/v1"
  model: "Qwen/Qwen3.8-27B-FP8"
  temperature: 0.3
  max_tokens: 9999
  timeout_seconds: 180
  max_schema_retries: 2
  # api_key: from AOC_LLM__API_KEY

memory:
  provider: "letta"                 # letta | none
  letta_base_url: "http://127.0.0.1:8283"
  agent_name: "aoc-organism-memory"
  timeout_seconds: 60

perception:
  monitored_services: []            # e.g. [{name: "stock-web", url: "http://127.0.0.1:9090/"}]
  disk_paths: ["/"]
  llm_probe: true

governance:
  # Default max permission an autonomous task may receive without human approval.
  auto_approve_max_level: "L2"
  workspace_root: "/home/ubuntu/aoc-workspaces"
  budget:
    max_agent_tasks_per_day: 9999
    max_task_timeout_seconds: 600
    max_concurrent_tasks: 1
    max_llm_calls_per_cycle: 9999
    max_tokens_per_cycle: 99990000
    max_concurrent_llm_calls: 16
    max_llm_tokens_per_day: 999900000
    emergency_llm_calls_per_day: 9999
    emergency_llm_tokens_per_day: 99990000
    hard_daily_llm_tokens_cap: 999990000
    max_task_retries: 2
    circuit_breaker_threshold: 5
    circuit_breaker_cooldown_seconds: 30.0

logging:
  level: "INFO"
  json: true

social:
  enabled: false                    # V5.1 unified autonomous social loop (disable for pure V5.0.1 mode)
  auto_enable_affect: true          # Activate AffectModulator automatically when social.enabled=true
  dialogue_window_turns: 16
  max_inbox_batch: 5
  min_proactive_interval_minutes: 45
  proactive_backoff_multiplier: 2.0
  proactive_max_backoff_minutes: 480
  proactive_enabled: true
  max_defer_count: 2
  proactive_valence_threshold: 0.55
  proactive_arousal_threshold: 0.48
  proactive_frustration_threshold: 0.60
  proactive_boredom_threshold: 0.65
  proactive_high_ig_threshold: 0.68
  milestone_dedup_hours: 24
  social_memory_max_importance: 0.72
  default_defer_minutes: 15
  min_defer_minutes: 3
  max_defer_minutes: 180
  max_reply_chars: 1200
  memory_promotion_min_importance: 0.65
  allowed_reaction_emojis: ["👀", "👍", "🤔", "🙈", "🔥", "❤️", "🎉", "👌"]
  fallback_reaction_emoji: "👀"
  wake_debounce_seconds: 1.5

kernel_v3:
  brain_research_enabled: false     # V5.2 M1: Brain-native research/synthesis path (0 Codex for pure research)
  max_brain_research_mcp_calls: 4   # max bounded L0 read-only MCP calls per brain_research execution
  interest_portfolio_enabled: false # V5.2 M2: Persistent interest_portfolio, cross-domain quotas & fatigue pivoting
  max_same_domain_streak: 3         # force pivot after N consecutive curiosity goals in same domain/comfort zone
  max_same_topic_streak: 3          # force pivot after N consecutive curiosity goals in same normalized topic bucket
  portfolio_starvation_cycles: 6    # flag human_seeded interest starved after N untouched curiosity cycles
  explicit_skill_refactor_enabled: false # V5.2 M3: Block blind duplicate evolution; require explicit skill_refactor_target staging
  draft_skill_expiry_hours: 48      # Auto-deprecate unvalidated DRAFT skills older than N hours
