# Digital World Perception Sensors Configuration (V2.0 P1-5)
enabled: true
poll_on_perceive: false
max_response_bytes: 2097152  # 2 MB hard cap
timeout_seconds: 15.0
max_redirects: 3
importance_threshold: 0.45
dedup_window_hours: 168

# Strict domain allowlist for passive periodic RSS & Web Change polling sensors (SSRF + DNS Rebinding protected).
# Note: Active L0 research via `web_search` (SearXNG) and `web_fetch_readonly` when `brain_research_enabled=true`
# permits public HTTPS retrieval across open domains (blocking private/loopback/metadata IPs & prompt injections),
# keeping cross-domain exploration unbound by this static 7-domain RSS list.
allowed_domains:
  - "www.postgresql.org"
  - "blog.python.org"
  - "docs.python.org"
  - "github.com"
  - "raw.githubusercontent.com"
  - "arxiv.org"
  - "export.arxiv.org"

# Strict read-only local filesystem roots for Git Repository sensor
allowed_git_roots:
  - "/home/ubuntu/aoc"

# Relevance keywords boosting importance scoring (kept general; emergent topics come from self-driven investigation)
interest_keywords:
  - "postgresql"
  - "pgvector"
  - "python"
  - "asyncio"
  - "systemd"
  - "cgroup"
  - "onnx"
  - "embedding"
  - "agent"
  - "mcp"
  - "security"
  - "vulnerability"
  - "release"
  - "performance"
  - "linux"
  - "database"
  - "llm"
  - "cognition"
  - "psychology"
  - "neuroscience"
  - "science"
  - "reasoning"

# Default configured sources (can be toggled via POST /v2/world/sources/{id}/enable|disable)
sources:
  - source_id: "git-aoc-repo"
    sensor_type: "git"
    name: "AOC Local Repository (Read-Only)"
    enabled: true
    reliability_score: 0.95
    poll_interval_seconds: 600
    config:
      repo_path: "/home/ubuntu/aoc"
      branch: "HEAD"
      max_commits: 5
  - source_id: "rss-postgresql-news"
    sensor_type: "rss"
    name: "PostgreSQL Official News Feed"
    enabled: false
    reliability_score: 0.90
    poll_interval_seconds: 3600
    config:
      url: "https://www.postgresql.org/news.rss"
      max_items: 10
  - source_id: "web-python-whatsnew"
    sensor_type: "web"
    name: "Python 3.12 Documentation Release Notes"
    enabled: false
    reliability_score: 0.90
    poll_interval_seconds: 3600
    config:
      url: "https://docs.python.org/3.12/whatsnew/3.12.html"
  # Preset external feeds disabled by default in V4.2 so AOC discovers and registers channels organically
  - source_id: "rss-arxiv-cs-ai"
    sensor_type: "rss"
    name: "arXiv cs.AI Research Feed"
    enabled: false
    reliability_score: 0.85
    poll_interval_seconds: 3600
    config:
      url: "https://export.arxiv.org/rss/cs.AI"
      max_items: 10
  - source_id: "rss-arxiv-cs-lg"
    sensor_type: "rss"
    name: "arXiv cs.LG Machine Learning Feed"
    enabled: false
    reliability_score: 0.85
    poll_interval_seconds: 3600
    config:
      url: "https://export.arxiv.org/rss/cs.LG"
      max_items: 10
  - source_id: "rss-github-pgvector-releases"
    sensor_type: "rss"
    name: "GitHub pgvector Releases"
    enabled: false
    reliability_score: 0.92
    poll_interval_seconds: 7200
    config:
      url: "https://github.com/pgvector/pgvector/releases.atom"
      max_items: 5
  - source_id: "rss-github-letta-releases"
    sensor_type: "rss"
    name: "GitHub Letta Releases"
    enabled: false
    reliability_score: 0.90
    poll_interval_seconds: 7200
    config:
      url: "https://github.com/letta-ai/letta/releases.atom"
      max_items: 5
  # V5.2 M2: Cross-domain arXiv preset slots (disabled by default; allowlisted via export.arxiv.org)
  - source_id: "rss-arxiv-q-bio-nc"
    sensor_type: "rss"
    name: "arXiv q-bio.NC Neurons & Cognition Feed"
    enabled: false
    reliability_score: 0.85
    poll_interval_seconds: 7200
    config:
      url: "https://export.arxiv.org/rss/q-bio.NC"
      max_items: 8
  - source_id: "rss-arxiv-cs-cy"
    sensor_type: "rss"
    name: "arXiv cs.CY Computers & Society Feed"
    enabled: false
    reliability_score: 0.85
    poll_interval_seconds: 7200
    config:
      url: "https://export.arxiv.org/rss/cs.CY"
      max_items: 8
