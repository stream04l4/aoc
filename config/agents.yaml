# AgentProvider & MCP ToolProvider declarations (V2.0 P1-6)
# Strict conceptual boundary:
#   - `agents` = AgentProvider (autonomous multi-step planning & execution: Codex CLI; Hermes remains DISABLED).
#   - `mcp_servers` = ToolProvider (atomic guarded MCP tools establishing a second controlled execution path,
#     NOT a second autonomous general Agent and NOT multi-agent collaboration).
agents:
  - agent_id: codex
    name: "OpenAI Codex CLI"
    agent_type: cli
    adapter: codex
    binary: "codex"
    capabilities: [coding, debugging, code_review, terminal, repository_analysis, system_diagnosis, research, knowledge_summarization, general_task]
    supported_modes: [read-only, workspace-write]
    max_concurrency: 1
    enabled: true
    experimental: false
    options:
      sandbox: "workspace-write"   # danger-full-access is ALWAYS refused by CodexAdapter
      use_aoc_llm: true            # route codex exec to AOC's OpenAI-compatible vLLM endpoint (wire_api=responses)
      model: null                  # null -> uses AOC_LLM__MODEL when use_aoc_llm=true, else codex default
      persist_session: false       # false -> --ephemeral; true -> enables controlled resume via thread_id
      worktree: false              # optional --worktree isolation for Git repo tasks

  - agent_id: hermes
    name: "Hermes Agent (Disabled)"
    agent_type: cli
    adapter: hermes
    binary: "hermes"
    capabilities: [research, general_task, knowledge_summarization]
    supported_modes: [oneshot]
    max_concurrency: 1
    enabled: false                 # DISABLED per Decision 4: host does not install Hermes
    experimental: true
    options:
      toolsets: "web,file"
      max_turns: 30
      safe_mode: true
      ignore_user_config: false

  # Generic extension point for other CLI agents (e.g. DSH) - disabled until verified.
  - agent_id: generic-dsh
    name: "DSH (unverified)"
    agent_type: cli
    adapter: generic_cli
    binary: "dsh"
    capabilities: []
    supported_modes: []
    max_concurrency: 1
    enabled: false
    experimental: true
    options:
      command_template: []

# Guarded MCP ToolProvider servers (second controlled execution path — 3 real tools)
mcp_servers:
  - server_name: "aoc-mcp-web"
    enabled: true
    command: ["${PYTHON}", "-m", "app.tools.builtin_servers", "aoc-mcp-web"]
    tools:
      - tool_name: "web_fetch_readonly"
        description: "Read-only allowlisted HTTPS web fetch returning clean Markdown excerpt (SSRF/metadata blocked)"
        permission_level: "L0"
        timeout_seconds: 15.0
        max_output_bytes: 16384
        enabled: true
        input_schema:
          type: object
          required: ["url"]
          additionalProperties: false
          properties:
            url:
              type: string

  - server_name: "aoc-mcp-fs"
    enabled: true
    command: ["${PYTHON}", "-m", "app.tools.builtin_servers", "aoc-mcp-fs"]
    tools:
      - tool_name: "workspace_filesystem"
        description: "Workspace-locked directory listing, file reading (L0), and artifact writing (L1); blocks symlink/.. escapes and .aoc_* files"
        permission_level: "L0"
        action_levels:
          list_dir: "L0"
          read_file: "L0"
          write_file: "L1"
        timeout_seconds: 10.0
        max_output_bytes: 16384
        enabled: true
        input_schema:
          type: object
          required: ["action"]
          additionalProperties: false
          properties:
            action:
              type: string
              enum: ["list_dir", "read_file", "write_file"]
            path:
              type: string
            content:
              type: string

  - server_name: "aoc-mcp-gitdocs"
    enabled: true
    command: ["${PYTHON}", "-m", "app.tools.builtin_servers", "aoc-mcp-gitdocs"]
    tools:
      - tool_name: "git_docs_search"
        description: "Read-only git log, grep, and documentation search inside allowlisted repositories (no push/reset/hooks)"
        permission_level: "L0"
        timeout_seconds: 15.0
        max_output_bytes: 16384
        enabled: true
        input_schema:
          type: object
          required: ["action"]
          additionalProperties: false
          properties:
            action:
              type: string
              enum: ["git_log", "grep", "read_doc"]
            repo_path:
              type: string
            query:
              type: string
            doc_path:
              type: string
            limit:
              type: integer
